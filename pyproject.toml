[project]
name = "cm-mcp-server"
version = "0.1.0"
description = "MCP server somente leitura para a API REST do Cloudera Manager"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
]

[project.scripts]
cm-mcp-stdio = "cm_mcp_server.server:main_stdio"
cm-mcp-http = "cm_mcp_server.server:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cm_mcp_server"]
